services:
  licence-db:
    image: postgres:15.19
    networks:
      - hmpps
    container_name: licence-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_PASSWORD=licences
      - POSTGRES_USER=licences
      - POSTGRES_DB=licences

  licence-redis:
    image: 'redis:7.4'
    networks:
      - hmpps
    container_name: licence-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5

  gotenberg:
    image: thecodingmachine/gotenberg:7.8.2
    networks:
      - hmpps
    container_name: gotenberg
    restart: always
    ports:
      - '3001:3000'
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3001/ping' ]

networks:
  hmpps:
